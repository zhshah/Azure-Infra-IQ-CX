version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Settings saved via the UI are persisted to ./config/.env on the host
      - SETTINGS_DIR=/app/config
      # Optional: pre-set credentials here instead of using the setup wizard
      # - AZURE_SUBSCRIPTION_ID=
      # - AZURE_TENANT_ID=
      # - AZURE_CLIENT_ID=
      # - AZURE_CLIENT_SECRET=
      # - AZURE_OPENAI_ENDPOINT=
      # - AZURE_OPENAI_KEY=
      # - AZURE_OPENAI_DEPLOYMENT=gpt-4o-mini
      # Optional shared L2 cache + distributed lock. Leave unset to disable
      # (the app degrades gracefully to in-process caching). For local dev the
      # bundled redis service below is used; for Azure paste the rediss:// URL.
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    volumes:
      # Settings persistence — credentials saved in the UI survive restarts
      - ./config:/app/config
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    restart: unless-stopped

  zuremap:
    image: ghcr.io/natechsa/zuremap:latest
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      # Service principal credentials (shared with backend) for auto-auth
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      - AZURE_SUBSCRIPTION_ID=${AZURE_SUBSCRIPTION_ID}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
      - zuremap
    restart: unless-stopped
